services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mopan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mopan}
      POSTGRES_DB: ${POSTGRES_DB:-mopan}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-mopan} -d ${POSTGRES_DB:-mopan}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-mopan}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-mopan}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: brings the schema up to date before backend/worker start.
  # This is why the quick start has no manual migration step.
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["alembic", "upgrade", "head"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mopan}:${POSTGRES_PASSWORD:-mopan}@postgres:5432/${POSTGRES_DB:-mopan}
      REDIS_URL: redis://:${REDIS_PASSWORD:-mopan}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    # These win over env_file, so Docker is unaffected by .env's host-side URLs -
    # which are 127.0.0.1 rather than localhost on purpose (see .env.example: on
    # Windows localhost costs a failed ::1 attempt on every connect).
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mopan}:${POSTGRES_PASSWORD:-mopan}@postgres:5432/${POSTGRES_DB:-mopan}
      REDIS_URL: redis://:${REDIS_PASSWORD:-mopan}@redis:6379/0
      UPLOAD_DIR: /app/data/uploads
      # 동봉된 생활정보 MCP(mcp-examples)가 컨테이너망 안에 있어서, 그것을
      # 등록하려면 사설망 MCP 주소를 허용해야 한다. 등록은 관리자 전용이라
      # 이 완화가 열어 주는 것은 "관리자가 내부 주소를 등록할 수 있다"까지다.
      # 외부에 공개하는 배포에서 내부망 탐색이 걱정되면 .env에서 false로.
      MCP_ALLOW_PRIVATE_NETWORKS: ${MCP_ALLOW_PRIVATE_NETWORKS:-true}
      # 동봉된 표 조회 MCP(/goods/mcp)를 부팅 시 기본 제공 서버로 자동 등록한다
      # (app/mcp/seed.py). compose가 채우는 이유: 이 호스트명은 컨테이너망에서만
      # 풀린다. 비우면 시딩이 꺼진다.
      BUNDLED_MCP_SEED_URL: ${BUNDLED_MCP_SEED_URL:-http://mcp-examples:8100/goods/mcp}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - uploaddata:/app/data/uploads
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10

  # 생활정보 MCP - 키 없는 공공 API(날씨·환율·공휴일)를 MCP 도구로 감싼 동봉
  # 예시. backend와 같은 이미지로 돌므로 새 Dockerfile도 새 의존성도 없다.
  # DB·Redis가 필요 없어 depends_on도 없다.
  mcp-examples:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: ["uvicorn", "app.examples_mcp.main:app", "--host", "0.0.0.0", "--port", "8100"]
    # /goods/mcp(상품분류 조회)가 코퍼스의 분류표 행을 읽는 데만 쓴다.
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mopan}:${POSTGRES_PASSWORD:-mopan}@postgres:5432/${POSTGRES_DB:-mopan}
    depends_on:
      postgres:
        condition: service_healthy
    # 확인용 호스트 노출: 브라우저에서 http://localhost:8100/healthz 로 살아있는지
    # 볼 수 있다. backend가 부르는 주소는 컨테이너망의 http://mcp-examples:8100/mcp.
    ports:
      - "127.0.0.1:8100:8100"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8100/healthz').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mopan}:${POSTGRES_PASSWORD:-mopan}@postgres:5432/${POSTGRES_DB:-mopan}
      REDIS_URL: redis://:${REDIS_PASSWORD:-mopan}@redis:6379/0
      UPLOAD_DIR: /app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - uploaddata:/app/data/uploads

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      # A BUILD arg, not `environment`. Measured: `next build` evaluates
      # next.config.js rewrites() once and bakes the destination into
      # .next/routes-manifest.json, and `next start` ignores the variable
      # afterwards. Under `environment:` this looked configured and did nothing,
      # so the container proxied /api/* to its own empty port 8000 and every
      # request failed - the same trap NEXT_PUBLIC_API_BASE_URL set, one layer
      # down. Changing it requires a rebuild, not a restart.
      args:
        API_INTERNAL_URL: http://backend:8000
    restart: unless-stopped
    # No env_file here on purpose: the frontend container has no business holding
    # OPENAI_API_KEY, POSTGRES_PASSWORD, or DATABASE_URL.
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"

  # 외부 공개 터널. 세션이 띄운 프로세스는 메모리 압박 때 회수되던 실사고가
  # 있어(2026-09-05), Docker가 직접 관리하는 서비스로 둔다 - 죽으면 자동
  # 재기동, 부팅 시(Docker Desktop 자동 시작이면) 같이 올라온다.
  #
  # Quick Tunnel이라 (재)시작할 때마다 URL이 바뀐다. 주소는:
  #   docker compose logs tunnel | grep trycloudflare
  # 고정 주소가 필요하면 Cloudflare 대시보드에서 Named Tunnel을 만들고 아래
  # command를 ["tunnel", "run", "--token", "<토큰>"] 으로 바꾼다.
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # --protocol http2: 컨테이너망에서 QUIC(UDP 7844) dial이 실패한다(실측
    # "failed to dial to edge with quic"). TCP 443만 쓰는 http2로 고정.
    command: ["tunnel", "--no-autoupdate", "--protocol", "http2", "--url", "http://frontend:3000"]
    depends_on:
      - frontend

volumes:
  pgdata:
  redisdata:
  uploaddata:
